<style>
:root{--bg:#faf7f2;--card:#fff;--ink:#2a2420;--muted:#8c8178;--line:#ece4da;--soft:#f3ede4;--accent:#7f9172;--accent2:#b8945a;--rose:#c98b8b;--danger:#c0564b;--ok:#5f8f5a;--shadow:0 1px 2px rgba(60,40,20,.05),0 4px 16px rgba(60,40,20,.05)}
@media (prefers-color-scheme:dark){:root{--bg:#141210;--card:#1e1b18;--ink:#f1ebe3;--muted:#9c9187;--line:#2f2a25;--soft:#27231f;--accent:#9db08e;--accent2:#d0ad74;--rose:#d79c9c;--danger:#e0756a;--ok:#86b880;--shadow:none}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:15px/1.45 Manrope,-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:var(--accent)}
#app{max-width:600px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(96px + env(safe-area-inset-bottom))}
.serif{font-family:"Cormorant Garamond",Georgia,serif}
h1.ttl{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-size:34px;line-height:1.1;margin:6px 0 14px;display:flex;align-items:center;gap:10px}
h1.ttl .back{font:500 15px Manrope,sans-serif;color:var(--accent)}
h2{font:600 13px Manrope,sans-serif;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:22px 4px 8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
h2 .lnk{text-transform:none;letter-spacing:0;color:var(--accent);font-weight:600}
.card{background:var(--card);border-radius:18px;box-shadow:var(--shadow);border:1px solid var(--line);overflow:hidden}
.pad{padding:16px}
.list>.row:not(:last-child){border-bottom:1px solid var(--line)}
.row{display:flex;align-items:center;gap:12px;padding:13px 16px;width:100%;text-align:left}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:13px;color:var(--muted);margin-top:2px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.row .r{text-align:right;font-weight:600;white-space:nowrap}
.row .r small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.row.ghost .t{color:var(--muted);font-weight:500}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap;background:var(--soft);color:var(--muted)}
.s-search{background:#f1e9dc;color:#9a7a45}.s-talks{background:#e7ecf3;color:#5a7090}.s-contract{background:#e9efe3;color:#5d7a4f}.s-paid{background:#5f8f5a;color:#fff}.s-no{background:#f5e3e1;color:#b0564b}.s-none{background:var(--soft);color:var(--muted)}.s-late{background:#f5e3e1;color:#b0564b}.s-now{background:#e9efe3;color:#5d7a4f}
@media (prefers-color-scheme:dark){.s-search{background:#3a3124;color:#d6b57c}.s-talks{background:#25303d;color:#9fb6d6}.s-contract{background:#2a3525;color:#a9c69a}.s-paid{background:#4d7a48}.s-no,.s-late{background:#3d2624;color:#e6928a}.s-now{background:#2a3525;color:#a9c69a}}
.bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .b1{background:var(--accent)}.bar .b2{background:var(--accent2);opacity:.55}.bar .over{background:var(--danger)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 13px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--muted)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip b{font-weight:700;opacity:.7;margin-left:4px}
.hero{text-align:center;padding:26px 16px 22px;background:linear-gradient(160deg,var(--card),var(--soft));border-radius:24px;border:1px solid var(--line);margin-top:4px}
.hero .names{font:600 36px/1.05 "Cormorant Garamond",Georgia,serif}
.hero .names span{color:var(--accent2);font-style:italic;margin:0 4px}
.hero .date{color:var(--muted);margin-top:6px;font-size:14px}
.hero .count{margin-top:14px;font:600 64px/1 "Cormorant Garamond",Georgia,serif;color:var(--accent)}
.hero .count small{display:block;font:600 12px Manrope,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stats.s4{grid-template-columns:repeat(4,1fr)}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow)}
.stat .v{font-weight:700;font-size:17px;white-space:nowrap}
.stat .l{font-size:12px;color:var(--muted)}
.stats.s4 .stat{padding:10px 6px;text-align:center}.stats.s4 .v{font-size:19px}
.big{font:600 34px/1.1 "Cormorant Garamond",Georgia,serif}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.ck{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;transition:.15s}
.ck.on{background:var(--accent);border-color:var(--accent)}
.ck.on::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.done .t{text-decoration:line-through;color:var(--muted);font-weight:500}
.fab{position:fixed;right:max(18px,calc(50% - 282px));bottom:calc(84px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;background:var(--ink);color:var(--bg);font-size:30px;line-height:56px;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.2);z-index:20}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabbar .in{max-width:600px;margin:0 auto;display:flex}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 7px;font-size:11px;font-weight:600;color:var(--muted)}
.tabbar button.on{color:var(--accent)}
.tabbar svg{width:24px;height:24px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 18px;border-radius:14px;font-weight:700;background:var(--soft);color:var(--ink)}
.btn.pri{background:var(--ink);color:var(--bg)}
.btn.acc{background:var(--accent);color:#fff}
.btn.danger{color:var(--danger)}
.btn.w{width:100%}
.btn:disabled{opacity:.5}
.btnrow{display:flex;gap:10px;margin-top:14px}.btnrow .btn{flex:1}
.banner{background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:10px 14px;font-size:13px;color:var(--muted);margin-bottom:12px}
.empty{text-align:center;color:var(--muted);padding:26px 16px;font-size:14px}
.sheet-bg{position:fixed;inset:0;background:rgba(20,15,10,.38);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .18s}
.sheet{background:var(--bg);width:100%;max-width:600px;max-height:92vh;overflow-y:auto;border-radius:22px 22px 0 0;padding:8px 18px calc(22px + env(safe-area-inset-bottom));animation:up .22s cubic-bezier(.2,.8,.2,1)}
.sheet .grab{width:38px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 10px}
.sheet .sh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.sheet .sh h3{margin:0;font:600 26px/1.15 "Cormorant Garamond",Georgia,serif}
.sheet .x{width:32px;height:32px;border-radius:50%;background:var(--soft);font-size:18px;color:var(--muted);flex:none}
.modal{z-index:60;align-items:center}
.modal .sheet{border-radius:20px;max-width:340px;margin:16px;animation:pop .18s}
@keyframes fade{from{opacity:0}}@keyframes up{from{transform:translateY(40px);opacity:.4}}@keyframes pop{from{transform:scale(.94);opacity:0}}
.f{margin-bottom:12px}
.f label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:0 0 5px 4px}
.f input,.f select,.f textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 13px;font-size:16px;outline:none;-webkit-appearance:none;appearance:none}
.f select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 52%,calc(100% - 13px) 52%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--accent)}
.f textarea{min-height:84px;resize:vertical}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tog{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 14px;background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;font-weight:500}
.tog input{width:22px;height:22px;accent-color:var(--accent);flex:none}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0 14px}
.kv div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px}
.kv b{display:block;font-size:15px;white-space:nowrap}
.kv span{font-size:12px;color:var(--muted)}
.info{font-size:14px;margin:4px 0}
.info span{color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:14px;font-size:14px;font-weight:600;z-index:80;max-width:90vw;text-align:center;animation:pop .2s}
.tables{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tbl{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;box-shadow:var(--shadow)}
.tbl .tn{display:flex;justify-content:space-between;align-items:center;font-weight:700;width:100%;text-align:left}
.tbl .tn small{font-weight:600;color:var(--muted)}
.tbl svg{display:block;margin:6px auto;width:96px;height:96px}
.gch{display:inline-block;font-size:12px;font-weight:600;background:var(--soft);border-radius:99px;padding:4px 10px;margin:3px 3px 0 0}
.gch.u{background:var(--card);border:1px dashed var(--muted)}
.menu .row svg{width:22px;height:22px;color:var(--accent);flex:none}
.chev{color:var(--muted);font-size:18px}
.skel{height:120px;border-radius:18px;background:var(--soft);margin-bottom:12px;animation:pulse 1.2s infinite alternate}
@keyframes pulse{to{opacity:.5}}
.prog{position:fixed;inset:0;background:var(--bg);z-index:90;display:grid;place-items:center;text-align:center;padding:30px}
.ob h1{font:600 40px/1.05 "Cormorant Garamond",Georgia,serif;margin:18px 0 6px}
.ob p{color:var(--muted);margin:0 0 18px}
.search{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 13px;font-size:16px;outline:none;margin-bottom:10px}
.mini{font-size:12px;color:var(--muted)}
.neg{color:var(--danger)}
.ro .fab,.ro .wr{display:none!important}
.sw{position:relative;overflow:hidden}
.list>.sw:not(:last-child){border-bottom:1px solid var(--line)}
.list>.sw>.swc>.row{border-bottom:0}
.swa{position:absolute;inset:0 0 0 auto;width:92px;display:flex}
.swa button{flex:1;background:var(--danger);color:#fff;font-weight:700;font-size:14px}
.swc{position:relative;background:var(--card);transition:transform .22s cubic-bezier(.2,.8,.2,1);touch-action:pan-y}
.addrow{justify-content:center;font-weight:700;color:var(--accent);padding:16px;font-size:16px;border-top:1px solid var(--line)}
.amt{display:flex;align-items:baseline;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 16px;margin-bottom:14px}
.amt input{flex:1;min-width:0;border:0;background:none;outline:none;font:600 40px/1.1 "Cormorant Garamond",Georgia,serif;color:var(--ink)}
.amt span{font:600 28px "Cormorant Garamond",Georgia,serif;color:var(--muted)}
.ecats{flex-wrap:wrap;margin:0;padding:0;overflow:visible}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;padding:10px 6px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.rcpt{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.rprev{position:relative}.rprev img{display:block;max-width:100%;max-height:320px;border-radius:12px;border:1px solid var(--line)}
.rprev .x{position:absolute;top:6px;right:6px;width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff}
.mbgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mbcard{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;text-align:left;box-shadow:var(--shadow);display:flex;flex-direction:column}
.mbcov{height:110px;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:2px;background:var(--soft)}
.mbcov img,.mbcov i{width:100%;height:110px;object-fit:cover;display:block;background:var(--soft)}
.mbcov span{display:grid;place-items:center;font-size:38px;height:110px}
.mbinfo{padding:10px 12px 12px}.mbinfo .t{font-weight:700;font-size:14px}.mbinfo .s{font-size:12px;color:var(--muted);margin-top:2px}
.mbphotos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.mbph{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--soft);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:0;text-align:center}
.mbph img{width:100%;height:100%;object-fit:cover}
.mbph small{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.65));color:#fff;font-size:11px;padding:14px 6px 5px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mblink span{font-size:26px}.mblink b{font-size:12px;padding:0 6px;word-break:break-all}.mblink small{position:static;background:none;color:var(--muted);white-space:normal}
.mbadd{font-size:26px;color:var(--accent);border-style:dashed;cursor:pointer;background:var(--card)}.mbadd span{font-size:12px;font-weight:700}
.mbfull img{display:block;width:100%;border-radius:14px}
.tl .tm{font:700 17px Manrope,sans-serif;color:var(--accent);min-width:56px;align-self:flex-start;padding-top:1px}
.cm .t{font-size:15px}
@media (min-width:900px){.mbgrid{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}.mbphotos{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}.mbcov,.mbcov img,.mbcov i,.mbcov span{height:150px}}
.money{position:relative}
.f .money input{padding-right:36px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.money span{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-weight:600;pointer-events:none}
.amt input{font-variant-numeric:tabular-nums}
.dx{display:none!important}
@media (hover:hover){.row:hover{background:var(--soft)}button.row,.chip,.btn,.tabbar button{transition:background .12s}}
@media (min-width:900px){
  body{font-size:15px}
  .dx{display:flex!important}
  .mo{display:none!important}
  #app{max-width:1180px;margin:0 0 0 250px;padding:28px 40px 60px}
  .tabbar{top:0;bottom:0;left:0;right:auto;width:250px;border-top:0;border-right:1px solid var(--line);padding:0;background:var(--card)}
  .tabbar .in{flex-direction:column;align-items:stretch;height:100%;padding:22px 14px;gap:2px;overflow-y:auto}
  .tabbar button{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;padding:10px 12px;border-radius:12px;font-size:14px;color:var(--ink);font-weight:600}
  .tabbar button svg{width:20px;height:20px;color:var(--muted)}
  .tabbar button.on{background:var(--soft);color:var(--ink)}
  .tabbar button.on svg{color:var(--accent)}
  .tabbar .brand{flex-direction:column;padding:4px 12px 18px;margin-bottom:6px;border-bottom:1px solid var(--line)}
  .tabbar .bn{font:600 26px/1.1 "Cormorant Garamond",Georgia,serif}
  .tabbar .bn span{color:var(--accent2);font-style:italic}
  .tabbar .bd{font-size:12px;color:var(--muted);margin-top:4px}
  .tabbar .sep{height:1px;background:var(--line);margin:10px 4px}
  .tabbar .sidefoot{margin-top:auto;padding:12px;font-size:12px;color:var(--muted);flex-direction:column;word-break:break-all}
  h1.ttl{font-size:40px;margin-top:0}
  .hero{display:grid;grid-template-columns:1fr auto;align-items:center;text-align:left;padding:30px 36px}
  .hero .names{font-size:46px}.hero .count{margin:0;text-align:right;font-size:76px}
  .hero .date{grid-column:1;grid-row:2;margin-top:4px}.hero .count{grid-column:2;grid-row:1/span 2}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:0 28px;align-items:start}
  .catgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 24px;align-items:start}
  .stats.s4d{grid-template-columns:repeat(4,1fr)}
  .tables{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
  .chips{margin:0;padding-left:0;padding-right:0;flex-wrap:wrap;overflow:visible}
  .fab{right:40px;bottom:36px}
  .sheet-bg{align-items:center}
  .sheet{max-width:600px;border-radius:22px;max-height:88vh;padding:14px 26px 26px;margin:20px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
  .sheet .grab{display:none}
  .toast{bottom:40px;left:calc(50% + 125px)}
  body.noside #app{margin:0 auto;max-width:560px}
  .ob,.join,.auth,.recover{max-width:480px;margin-left:auto!important;margin-right:auto!important}
  .banner{max-width:none}
}
@media (min-width:1400px){.catgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}

</style>

<script>
"use strict";
const TPL = /*TPL*/null;
const PER = TPL.periods;
const VST = {search:["Смотрим","s-search"],talks:["Переговоры","s-talks"],contract:["Договор","s-contract"],paid:["Оплачено","s-paid"],rejected:["Отказались","s-no"]};
const PTYPE = {deposit:"Задаток",prepay:"Предоплата",extra:"Доплата",full:"Полная оплата"};
const PMETH = {cash:"Наличные",transfer:"Перевод",card:"Карта",invoice:"Счёт ИП/ООО"};
const PUR = {need:["Купить","s-search"],ordered:["Заказано","s-talks"],bought:["Куплено","s-paid"]};
const RSVP = {list:["В списке","s-none"],invited:["Приглашён","s-talks"],yes:["Придёт","s-paid"],no:["Не придёт","s-no"]};
const GROUPS = ["Семья","Друзья","Коллеги","Другое"];
const COLLS = ["categories","vendors","payments","tasks","purchases","guests","tables","expenses","mbphotos","mbcomments","schedule"];
const S = {settings:null,categories:[],vendors:[],payments:[],tasks:[],purchases:[],guests:[],tables:[],expenses:[],mbphotos:[],mbcomments:[],schedule:[]};
const CFG = window.WEDDING_CONFIG || {};
let sb = null, session = null, W = null, me = null, canWrite = true, phase = "boot", loaded = false, offline = false, outbox = [], members = [], tfTouched = false;
const ui = {vf:"all", tf:"all", pf:"all", gf:"all", lf:"all", q:""};

/* ---------- utils ---------- */

  const d = wDate();

    html += `<section class="cat"><h2><span>${esc(p.label)} ${tag}</span><span style="text-transform:none;letter-spacing:0">${end && p.key !== "day" ? "до " + esc(fmtShort(end)) : end ? esc(fmtShort(end)) : ""}</span></h2><div class="card list">${ts.map(taskRow).join("")}</div></section>`;
  }

  return html + fab("task");
}

/* ---------- SEATING ---------- */
function tableSVG(t, n) {
  const seats = Math.max(1, +t.seats || 1), r = 30, cx = 48, cy = 48;
  let dots = "";
  if (t.shape === "rect") {
    const half = Math.ceil(seats / 2);
    for (let i = 0; i < seats; i++) { const row = i < half ? 0 : 1, idx = row ? i - half : i, cnt = row ? seats - half : half; const x = 14 + (68 / (cnt + 1)) * (idx + 1); dots += `<circle cx="${x}" cy="${row ? 80 : 16}" r="6" fill="${i < n ? "var(--accent)" : "none"}" stroke="var(--accent)" stroke-width="1.5"/>`; }
    return `<svg viewBox="0 0 96 96"><rect x="12" y="30" width="72" height="36" rx="6" fill="var(--soft)" stroke="var(--line)"/><text x="48" y="53" text-anchor="middle" font-size="13" font-weight="700" fill="var(--ink)">${n}/${seats}</text>${dots}</svg>`;
  }
  for (let i = 0; i < seats; i++) { const a = -Math.PI / 2 + i * 2 * Math.PI / seats; dots += `<circle cx="${cx + Math.cos(a) * (r + 10)}" cy="${cy + Math.sin(a) * (r + 10)}" r="5.5" fill="${i < n ? "var(--accent)" : "none"}" stroke="var(--accent)" stroke-width="1.5"/>`; }
  return `<svg viewBox="0 0 96 96"><circle cx="${cx}" cy="${cy}" r="${r - 4}" fill="var(--soft)" stroke="var(--line)"/><text x="48" y="53" text-anchor="middle" font-size="13" font-weight="700" fill="var(--ink)">${n}/${seats}</text>${dots}</svg>`;
}

  window.__lastDownload = {fname, data};
}

async function createPlan(d, catOn, exOn) {
  const ov = document.createElement("div"); ov.className = "prog"; ov.innerHTML = `<div><div class="big">Создаём план…</div><p class="mini" id="pg"></p></div>`; document.body.appendChild(ov);

  const tick = () => { const el = $("#pg"); if (el) el.textContent = Math.min(100, Math.round(++n / steps * 100)) + "%"; };
  try {
    const keyId = {}, budget = +d.budget || 0, pctSum = sum(catOn, c => c.pct) || 1;
    for (let i = 0; i < catOn.length; i++) { const c = catOn[i]; keyId[c.key] = await add("categories", {key: c.key, name: c.name, emoji: c.emoji, planned: budget ? Math.round(budget * c.pct / pctSum / 1000) * 1000 : 0, order: i}); tick(); }
    let o = 0;

      if (ref && !keyId[ref] && !exOn.has(ref)) { tick(); continue; }
      await add("tasks", {title, period, who: whoK, catId: keyId[ref] || null, tag: exOn.has(ref) ? ref : null, auto: auto && keyId[ref] ? 1 : 0, done: false, order: o++}); tick();
    }
    o = 0;
    for (const [title, ref] of TPL.purchases) { if (!keyId[ref]) { tick(); continue; } await add("purchases", {title, catId: keyId[ref], status: "need", price: 0, who: "both", order: o++}); tick(); }
    const g = +d.guests || 0, nt = Math.max(1, Math.ceil(g / 10));
    await add("tables", {name: "Стол молодожёнов", seats: 2, shape: "rect", order: 0});
    for (let i = 1; i <= Math.min(nt, 20); i++) { await add("tables", {name: "Стол " + i, seats: 10, shape: "round", order: i}); tick(); }
    await saveSettings({...d, guests: g, budget, extras: [...exOn], createdAt: Date.now()});

}

/* ---------- SWIPE TO DELETE ---------- */
const swipe = (kind, id, inner) => canWrite ? `<div class="sw" data-sw="${kind}:${esc(id)}"><div class="swa"><button data-swdel aria-label="Удалить">Удалить</button></div><div class="swc">${inner}</div></div>` : inner;
let swOpen = null, swDrag = null, swSuppress = false;
function swClose(except) { if (swOpen && swOpen !== except) { swOpen.querySelector(".swc").style.transform = ""; swOpen.classList.remove("open"); swOpen = null; } }
document.addEventListener("pointerdown", e => {
  const c = e.target.closest(".swc"); if (!c || e.button > 0) { if (!e.target.closest(".swa")) swClose(); return; }
  const sw = c.parentElement; swClose(sw);
  swDrag = {sw, c, x: e.clientX, y: e.clientY, base: sw.classList.contains("open") ? -92 : 0, dir: null, dx: 0};
});
document.addEventListener("pointermove", e => {
  const d = swDrag; if (!d) return;
  const dx = e.clientX - d.x, dy = e.clientY - d.y;
  if (!d.dir) { if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return; d.dir = Math.abs(dx) > Math.abs(dy) ? "h" : "v"; if (d.dir === "h") d.c.style.transition = "none"; }
  if (d.dir !== "h") return;
  d.dx = dx; const t = Math.max(-120, Math.min(0, d.base + dx));
  d.c.style.transform = `translateX(${t}px)`;
});
document.addEventListener("pointerup", () => {
  const d = swDrag; swDrag = null; if (!d || d.dir !== "h") return;
  d.c.style.transition = ""; swSuppress = true; setTimeout(() => swSuppress = false, 50);
  if (d.base + d.dx < -46) { d.c.style.transform = "translateX(-92px)"; d.sw.classList.add("open"); swOpen = d.sw; }
  else { d.c.style.transform = ""; d.sw.classList.remove("open"); if (swOpen === d.sw) swOpen = null; }
});
document.addEventListener("pointercancel", () => { if (swDrag) { swDrag.c.style.transition = ""; swDrag.c.style.transform = swDrag.base ? "translateX(-92px)" : ""; swDrag = null; } });
document.addEventListener("click", e => { if (swSuppress) { e.stopPropagation(); e.preventDefault(); swSuppress = false; } }, true);

async function compressImage(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const k = Math.min(1, 1400 / Math.max(img.naturalWidth, img.naturalHeight));
    const cv = document.createElement("canvas"); cv.width = Math.round(img.naturalWidth * k); cv.height = Math.round(img.naturalHeight * k);
    cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
    let q = 0.7, out = cv.toDataURL("image/jpeg", q);
    while (out.length > 350000 && q > 0.3) { q -= 0.15; out = cv.toDataURL("image/jpeg", q); }
    return out;
  } finally { URL.revokeObjectURL(url); }
}

async function resizeTo(file, max, q0, limit) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const cv = document.createElement("canvas"); cv.width = Math.round(img.naturalWidth * k); cv.height = Math.round(img.naturalHeight * k);
    cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
    let q = q0, out = cv.toDataURL("image/jpeg", q);
    while (out.length > limit && q > 0.3) { q -= 0.1; out = cv.toDataURL("image/jpeg", q); }
    return out;
  } finally { URL.revokeObjectURL(url); }
}

  if (ds.mbcopy) { const t = boardText(ds.mbcopy); return t ? copyText(t, "Скопировано — отправьте подрядчику") : toast("Добавьте пожелания или вопросы"); }
  if (ds.cmres) { const c = S.mbcomments.find(x => x.id === ds.cmres); if (c && canWrite) upd("mbcomments", c.id, {resolved: !c.resolved}); return; }
  if (ds.cmtype) { t.parentElement.querySelectorAll("[data-cmtype]").forEach(b => b.classList.toggle("on", b === t)); return; }
  if (ds.sch) return editSched(S.schedule.find(x => x.id === ds.sch));
  if (ds.pur) return editPurchase(S.purchases.find(x => x.id === ds.pur));
  if (ds.guest) return editGuest(S.guests.find(x => x.id === ds.guest));
  if (ds.seat) return seatGuest(ds.seat);
  if (ds.table) return editTable(tableById(ds.table));
  if (ds.act) {
    const a = ds.act;
    if (a === "vendor") return addCandidate(null);
    if (a === "task") return editTask(null);
    if (a === "purchase") return editPurchase(null);
    if (a === "guest") return editGuest(null);
    if (a === "bulkGuests") return bulkGuests();
    if (a === "table") return editTable(null);
    if (a === "category") return editCategory(null);
    if (a === "expense") return editExpense(null);
    if (a === "schedItem") return editSched(null);
    if (a === "schedCopy") return copyText(schedText(), "Тайминг скопирован");
    if (a === "schedTpl") { (async () => { for (const [time, title, who2, place] of SCHED_TPL) await add("schedule", {time, title, who: who2, place}); toast("Типовой тайминг добавлен — поправьте под себя"); })(); return; }
    if (a === "export") return exportXlsx();
    if (a === "backup") return backupJSON();
    if (a === "retry") return start();
    if (a === "logout") { (async () => { if (outbox.length && !(await ask("Есть неотправленные изменения (" + outbox.length + "). Если выйти, они пропадут.", "Выйти"))) return; inviteCodes = null; members = []; await sb.auth.signOut(); session = null; start(); })(); return; }
    if (a === "budgetTotal") { if (!canWrite) return; return openForm({title: "Общий бюджет", fields: [{k: "budget", l: "Сумма, ₽", t: "num"}, {k: "split", l: "Распределить по категориям заново (по типичным долям)", t: "check"}], vals: {budget: st().budget}, onSave: async d => {
      await saveSettings({budget: d.budget});
      if (d.split && d.budget) { const shares = cats().map(c => ({c, p: (TPL.categories.find(x => x.key === c.key) || {pct: 3}).pct})); const tot = sum(shares, x => x.p) || 1; for (const {c, p} of shares) await upd("categories", c.id, {planned: Math.round(d.budget * p / tot / 1000) * 1000}); }
    }}); }
  }
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && sheetStack.length) closeSheet(); });
document.addEventListener("keydown", e => {
  const el = e.target; if (!el.matches || !el.matches("input[data-money]") || el.selectionStart !== el.selectionEnd) return;
  const p = el.selectionStart;
  if (e.key === "Backspace" && p > 0 && el.value[p - 1] === " ") el.setSelectionRange(p - 1, p - 1);
  if (e.key === "Delete" && el.value[p] === " ") el.setSelectionRange(p + 1, p + 1);
});
document.addEventListener("input", e => {
  if (e.target.matches && e.target.matches("input[data-money]")) moneyInput(e.target);
  if (e.target.id === "gq") { ui.q = e.target.value; applyGuestSearch(); }
  if (e.target.matches("[data-dr]")) calcDrinks();
});
document.addEventListener("change", e => {
  if (e.target.matches("[data-dr]")) calcDrinks();
  if (e.target.matches("[data-mbfile]") && e.target.files.length) { const fs = [...e.target.files], k = e.target.dataset.mbfile; e.target.value = ""; uploadMoodPhotos(k, fs); }
  if (e.target.matches("[data-restore]") && e.target.files[0]) { const f = e.target.files[0]; e.target.value = ""; restoreJSON(f); }
});
document.addEventListener("submit", async e => {
  if (e.target.matches("[data-cmform]")) {
    e.preventDefault(); if (!canWrite) return;
    const f = e.target, text = f.text.value.trim(); if (!text) { f.text.focus(); return; }
    const type = (f.querySelector("[data-cmtype].on") || {}).dataset?.cmtype || "wish";
    await add("mbcomments", {board: f.dataset.cmform, type, text, resolved: false});
    return;
  }
  if (e.target.id !== "setf") return;
  e.preventDefault(); if (!canWrite) return;
  const d = readForm(e.target, settingsFields());
  if (!d.date) return toast("Дата не может быть пустой");
  try { await saveSettings(d); toast("Сохранено"); } catch (err) {}
});
boot();
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
